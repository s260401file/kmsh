<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手術室 — 避難圖</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/evacuation.css">
</head>
<body>

  <!-- ── Header ── -->
  <header class="page-header">
    <div class="header-left">OR
      <span class="ward-sub">手術室</span>
    </div>
    <div class="header-center">
      <div class="staff-block">
        <div class="staff-label">手術室主任</div>
        <div class="staff-name" id="ward-director">—</div>
      </div>
      <div class="staff-block">
        <div class="staff-label">護理長</div>
        <div class="staff-name" id="head-nurse">—</div>
      </div>
    </div>
    <div class="header-right">
      <div class="update-label">資料更新時間：剛剛</div>
      <div class="clock-date" id="clock-date"></div>
      <div class="clock-time" id="clock-time"></div>
    </div>
  </header>

  <!-- ── Announcement marquee ── -->
  <div class="announce-bar">
    <span>🔔</span>
    <span>2026/05/24 手術室公告：今日共安排 7 台手術，OR-05 MVR 預計 13:00 完成，ICU 床位已預留，相關科別請備妥接收。</span>
  </div>

  <!-- ── Main content（整頁顯示後台上傳的避難圖圖片；此原型以內嵌示意圖代表）── -->
  <main class="main-content" style="padding:0;">
    <div class="ev-panel">
      <div class="ev-title">
        <span class="ev-title-bar"></span>
        避難圖
      </div>
      <div class="ev-map-wrap" style="display:flex;align-items:center;justify-content:center;flex:1;padding:0;">
        <!-- 後台上傳圖片（EvacuationTab：整頁 <img> objectFit contain）；原型以 inline SVG 示意 -->
        <svg viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"
             style="width:100%;height:100%;" xmlns="http://www.w3.org/2000/svg" role="img"
             aria-label="手術室避難逃生圖">
          <rect x="0" y="0" width="1000" height="620" fill="#FFFFFF"/>
          <rect x="0" y="0" width="1000" height="70" fill="#E64A19"/>
          <text x="500" y="46" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="700"
                font-family="Microsoft JhengHei UI, sans-serif">5F 手術室 避難逃生圖</text>

          <!-- 平面外框 -->
          <rect x="40" y="100" width="920" height="400" fill="#F0F8F4" stroke="#CBD9E3" stroke-width="2" rx="10"/>
          <text x="60" y="128" fill="#3A5068" font-size="17" font-weight="700" font-family="Microsoft JhengHei UI, sans-serif">手術室（OR-01～03、OR-05～08）</text>

          <!-- 樓梯間 -->
          <rect x="800" y="112" width="140" height="46" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5" rx="6"/>
          <text x="870" y="141" text-anchor="middle" fill="#F57F17" font-size="18" font-weight="700" font-family="Microsoft JhengHei UI, sans-serif">樓梯間</text>

          <!-- 刀房方塊（兩列） -->
          <g font-family="Microsoft JhengHei UI, sans-serif" font-size="22" font-weight="700">
            <rect x="80"  y="200" width="180" height="90" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="8"/>
            <text x="170" y="252" text-anchor="middle" fill="#2E7D32">OR-01</text>
            <rect x="290" y="200" width="180" height="90" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="8"/>
            <text x="380" y="252" text-anchor="middle" fill="#2E7D32">OR-02</text>
            <rect x="500" y="200" width="180" height="90" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="8"/>
            <text x="590" y="252" text-anchor="middle" fill="#2E7D32">OR-03</text>
            <rect x="710" y="200" width="180" height="90" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="8"/>
            <text x="800" y="252" text-anchor="middle" fill="#2E7D32">OR-05</text>

            <rect x="80"  y="310" width="180" height="90" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="8"/>
            <text x="170" y="362" text-anchor="middle" fill="#2E7D32">OR-06</text>
            <rect x="290" y="310" width="180" height="90" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="8"/>
            <text x="380" y="362" text-anchor="middle" fill="#2E7D32">OR-07</text>
            <rect x="500" y="310" width="180" height="90" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="8"/>
            <text x="590" y="362" text-anchor="middle" fill="#2E7D32">OR-08</text>
            <rect x="710" y="310" width="180" height="90" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="2" rx="8"/>
            <text x="800" y="356" text-anchor="middle" fill="#C62828" font-size="19">緊急出口</text>
            <text x="800" y="382" text-anchor="middle" fill="#C62828" font-size="15" font-weight="400">EXIT ▶</text>
          </g>

          <!-- 避難方向箭頭 -->
          <text x="500" y="452" text-anchor="middle" fill="#E64A19" font-size="30" font-weight="700" font-family="Microsoft JhengHei UI, sans-serif">↓</text>
          <text x="500" y="484" text-anchor="middle" fill="#E64A19" font-size="18" font-weight="700" font-family="Microsoft JhengHei UI, sans-serif">避難方向 → 1F 戶外集合點</text>

          <!-- 圖例 -->
          <g font-family="Microsoft JhengHei UI, sans-serif" font-size="17">
            <rect x="60"  y="530" width="22" height="22" fill="#C8E6C9" stroke="#81C784" stroke-width="1.5" rx="4"/>
            <text x="92"  y="547" fill="#3A5068">手術室</text>
            <rect x="230" y="530" width="22" height="22" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="1.5" rx="4"/>
            <text x="262" y="547" fill="#3A5068">緊急出口</text>
            <rect x="420" y="530" width="22" height="22" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5" rx="4"/>
            <text x="452" y="547" fill="#3A5068">樓梯間</text>
          </g>

          <text x="500" y="595" text-anchor="middle" fill="#7A8FA0" font-size="15"
                font-family="Microsoft JhengHei UI, sans-serif">＊本圖由管理後台上傳，實際避難路線以現場標示與消防演練為準　（更新日：2026/07）</text>
        </svg>
      </div>
    </div>
  </main>

  <!-- ── Bottom tabs ── -->
  <nav class="bottom-tabs">
    <a href="index.html"      class="tab-btn">手術動態</a>
    <a href="schedule.html"   class="tab-btn">手術派班</a>
    <a href="handover.html"   class="tab-btn">特殊交班</a>

    <a href="evacuation.html" class="tab-btn active">避難圖</a>
    <a href="surgerylist.html" class="tab-btn">手術清單</a>
    <a href="assist.html" class="tab-btn">各科協助業務</a>
  </nav>

  <script src="js/mockData.js"></script>
  <script src="js/evacuation.js"></script>
</body>
</html>
